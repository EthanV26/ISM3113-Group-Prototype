<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c50">
  <title>DigiDocLocker — Your documents, in one secure place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="DigiDocLocker home" data-view="dashboard">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.75h7l4.25 4.5v12H7a2 2 0 0 1-2-2v-12a2.5 2.5 0 0 1 2-2.5Z"/><path d="M14 4v5h4M9 13h6M9 16.5h6"/></svg></span>
        <span class="brand-name">DigiDoc<span>Locker</span></span>
      </a>
      <div class="workspace-picker"><span class="workspace-icon">A</span><span class="workspace-text"><strong>Acme Workspace</strong><small>Personal account</small></span><svg class="tiny-chevron" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
        <button class="nav-item" data-view="documents"><svg viewBox="0 0 24 24"><path d="M7 3.75h7l4.25 4.5v12H7a2 2 0 0 1-2-2v-12a2.5 2.5 0 0 1 2-2.5Z"/><path d="M14 4v5h4M9 13h6M9 16.5h6"/></svg>My Documents<span class="nav-count" id="nav-doc-count">8</span></button>
        <button class="nav-item" data-view="upload"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v4.25A1.75 1.75 0 0 0 6.75 20h10.5A1.75 1.75 0 0 0 19 18.25V14"/></svg>Upload Documents</button>
        <button class="nav-item" data-view="requests"><svg viewBox="0 0 24 24"><path d="M8 4.5h8a2 2 0 0 1 2 2v13l-6-3-6 3v-13a2 2 0 0 1 2-2Z"/><path d="M9.5 9h5M9.5 12h5"/></svg>Document Requests<span class="nav-count alert-count">3</span></button>
        <button class="nav-item" data-view="verification"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M8 11l2 2 4-4"/></svg>Verification Center<span class="nav-count alert-count" id="nav-verify-count">2</span></button>
        <button class="nav-item" data-view="organizations"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M4 12h16M10 12v2h4v-2"/></svg>Organizations</button>
      </nav>
      <div class="nav-label nav-label-lower">PREFERENCES</div>
      <nav class="main-nav" aria-label="Preferences">
        <button class="nav-item" data-view="security"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10M12 14v2"/></svg>Security</button>
        <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 1 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 1 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V4a1.7 1.7 0 1 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 1 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2.9Z"/></svg>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.35 2.35 0 1 1 4.4 1.1c-.7 1.1-2.1 1.3-2.1 2.9M12 16.5h.01"/></svg></div><strong>Need a hand?</strong><p>Our support team is here for you.</p><button class="text-link" data-toast="Support center is coming soon.">Visit help center <span>↗</span></button></div>
        <button class="profile-card" data-view="settings"><span class="avatar">JD</span><span class="profile-text"><strong>Jordan Davis</strong><small>jordan.davis@email.com</small></span><svg class="more-icon" viewBox="0 0 20 20"><circle cx="4" cy="10" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
        <div class="topbar-actions">
          <button class="icon-button top-search" aria-label="Search" data-view="documents"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button>
          <button class="icon-button notification-button" aria-label="Notifications" data-view="requests"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i></i></button>
          <span class="topbar-divider"></span>
          <button class="top-user" data-view="settings"><span class="avatar small-avatar">JD</span><span>Jordan Davis</span><svg class="tiny-chevron" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <script src="app.js"></script>
</body>
</html>
